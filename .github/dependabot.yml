# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7

  # The workflows pin every action to a commit sha with the tag in a trailing
  # comment, which is what keeps a moving tag from silently changing what CI
  # runs. Dependabot understands that form and bumps both, so the pins stay
  # pinned rather than drifting back to tags nobody is watching.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
