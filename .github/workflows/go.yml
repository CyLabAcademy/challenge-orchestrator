name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORK_LOGGING: debug

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # ci/version.sh needs tags, and needs enough history to count the
        # distance from one. The default shallow checkout has neither, so
        # `git describe --tags` fell through to a bare commit id and every
        # binary CI produced was stamped with that instead of a version.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.x'
        cache: true
      id: go

    - name: Get dependencies
      run: go mod download

    - name: Golang linting
      run: go vet ./...

    - name: Build
      run: |
        mkdir -p bin
        # Assigned on its own line so a failure in version.sh fails the job.
        # Substituted inline into `go build`, a non-zero exit is swallowed and
        # the step quietly produces, and tests, an unstamped binary.
        LDFLAGS=$(sh ci/version.sh --ldflags)
        echo "building $(sh ci/version.sh)"
        go build -v -ldflags "$LDFLAGS" -o bin/ ./cmd/...

    - name: Unit Tests
      run: go test -v -count=1 -race -coverprofile=coverage.out ./...

    - name: Display Coverage
      run: go tool cover -func=coverage.out
