name: Go

on:
  # This job checks out, builds and tests, which a documentation or ansible
  # change gives no reason to do. Anything the build or the tests actually
  # read is listed; the embedded assets come along with their directories.
  push:
    branches: [ main ]
    paths:
      - 'cork/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'ci/**'
      # The seccomp tests read examples/seccomp and examples/execstack off
      # disk and fail when either has drifted from the embedded profile, so a
      # change there is a change this job has to see.
      - 'examples/**'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cork/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'ci/**'
      # The seccomp tests read examples/seccomp and examples/execstack off
      # disk and fail when either has drifted from the embedded profile, so a
      # change there is a change this job has to see.
      - 'examples/**'
      - '.github/workflows/go.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORK_LOGGING: debug

jobs:
  build:
    name: Build (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    # The go.mod directive stays at the version the module requires; 1.27 is
    # here for early warning only -- CGO (mattn/go-sqlite3) and the vet checks
    # `go test` gained are where a Go minor usually bites, and both are worth
    # hearing about before anyone depends on them. A 1.27 job that fails is a
    # thing to look at, not a thing that blocks a merge, so it is advisory
    # until the directive moves to match.
    continue-on-error: ${{ matrix.go == '1.27.x' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64, the other architecture released
        go:
          - '1.26.x' # what go.mod requires
          - '1.27.x' # advisory; see continue-on-error above

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # ci/version.sh needs tags, and needs enough history to count the
        # distance from one. The default shallow checkout has neither, so
        # `git describe --tags` fell through to a bare commit id and every
        # binary CI produced was stamped with that instead of a version.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        cache: true
      id: go

    - name: Get dependencies
      run: go mod download

    - name: Golang linting
      run: go vet ./...

    - name: Build
      run: |
        mkdir -p bin
        # Assigned on its own line so a failure in version.sh fails the job.
        # Substituted inline into `go build`, a non-zero exit is swallowed and
        # the step quietly produces, and tests, an unstamped binary.
        LDFLAGS=$(sh ci/version.sh --ldflags)
        echo "building $(sh ci/version.sh)"
        go build -v -ldflags "$LDFLAGS" -o bin/ ./cmd/...

    # Raising the go.mod directive above every go-version here would make the
    # toolchain switch to a golang.org/toolchain module, which ships no
    # covdata -- and coverage then fails on any package without a test file.
    # Move the directive and this matrix together.
    - name: Unit Tests
      run: go test -v -count=1 -race -coverprofile=coverage.out ./...

    - name: Display Coverage
      run: go tool cover -func=coverage.out
