on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create-release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Collect examples
        run: |
          tar czvf examples.tar.gz examples

      - name: Upload Examples
        id: upload-examples
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./examples.tar.gz
          asset_name: examples.tar.gz
          asset_content_type: application/octet-stream
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      matrix:
        os:
          - ubuntu-latest # amd64
          - macos-latest # arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The tag being released is present at depth 1, but the distance
          # count is not, so ci/version.sh needs the history behind it too.
          fetch-depth: 0

      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          cache: true
        id: go

      - name: Build project
        run: |
          # Read the version BEFORE `go get`, which can write go.mod/go.sum
          # (a missing requirement, a toolchain line) and would then make
          # ci/version.sh report the tag with a -dirty suffix -- on a published
          # release asset.
          LDFLAGS=$(sh ci/version.sh --ldflags)
          echo "releasing $(sh ci/version.sh)"
          go get -v -t -d ./...
          mkdir bin
          CGO_ENABLED=1 go build -v -ldflags "$LDFLAGS" -o bin ./...
          cp LICENSE bin/LICENSE
          cat NOTICE NOTICE.release > bin/NOTICE
          # The pre-rename names ride along as symlinks so an installer or a
          # script that still says cmgrd or cmgrd-cli keeps working. They go
          # away two minor releases after the rename.
          cd bin && ln -s corkd cmgrd && ln -s cork cmgrd-cli
          tar czvf cork.tar.gz corkd cork cmgrd cmgrd-cli LICENSE NOTICE

      - name: Get OS/architecture suffix
        id: suffix
        run: |
          echo "arch_suffix=`go version | cut -d ' ' -f 4,4 | tr '/' '_'`" >> "$GITHUB_OUTPUT"

      - name: Upload Binaries
        id: upload-binaries
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./bin/cork.tar.gz
          asset_name: cork_${{ steps.suffix.outputs.arch_suffix }}.tar.gz
          asset_content_type: application/octet-stream

      # The same tarball under the pre-rename asset name, for installers that
      # still fetch it (the ansible cork role, until its default moves). Dropped
      # together with the symlinks above.
      - name: Upload Binaries (pre-rename asset name)
        id: upload-binaries-legacy-name
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./bin/cork.tar.gz
          asset_name: cmgr_${{ steps.suffix.outputs.arch_suffix }}.tar.gz
          asset_content_type: application/octet-stream
