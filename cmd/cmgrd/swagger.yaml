swagger: "2.0"
info:
  description: "This is a minimal REST API for `cmgr` that allows front-ends for a CTF to remotely manage challenges and their templating for events.  It is not intended to replace `cmgr` entirely as it does not currently expose the challenge update process."
  version: "0.2.0"
  title: "cmgrd"
  contact:
    email: "code@acictf.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
tags:
- name: "challenges"
  description: "Management of templatable challenges as well as accessing their metadata."
- name: "builds"
  description: "Management of challenges that have been templated with a concrete flag and associated artifacts."
- name: "instances"
  description: "Management of challenge instances with which competitors can interact."
- name: "schemas"
  description: "Management of schemas which group build and instance resources into a single declarative unit."
schemes:
- "http"
paths:
  /challenges:
    get:
      parameters:
        - name: "tags"
          in: "query"
          description: "Seach for available challenges limiting to given tags"
          required: false
          type: array
          items:
            type: string
      tags: [challenges]
      produces: ["application/json"]
      summary: "Lists all available challenges"
      responses:
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "A list of all valid challenge identifiers"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ChallengeListElement"
  /challenges/{challenge_id}:
    parameters:
      - name: "challenge_id"
        in: "path"
        description: "The identifier for the challenge"
        required: true
        type: "string"
    get:
      tags: [challenges]
      produces: ["application/json"]
      summary: "Gets the metadata for the challenge"
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the challenge"
          schema:
            $ref: "#/definitions/ChallengeMetadata"
    post:
      tags: [challenges]
      produces: ["application/json"]
      summary: "Builds templated versions of the challenge"
      description: "Uses the flag format and seed to template out a new version of the challenge.  This may take a signficant amount of time."
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/BuildChallengeRequest"
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "A list of the new build IDs in the same order as seeds were given"
          schema:
            type: array
            items:
              type: integer
              format: int64
    put:
      tags: [challenges]
      consumes: ["multipart/form-data"]
      produces: ["application/json"]
      summary: "Hands the challenge and its builds over from an external build plane"
      description: "How a build reaches a cmgrd on an external build plane (CMGR_BUILD_PLANE=external): the challenge as the build plane scanned it and each build as the build there left it, the images already pushed to the registry and the artifact archives in the request. Every build's content checksum is recomputed from the payload's inputs (its source checksum, the flag format, the pin fingerprint and this daemon's template for the challenge type), every image tag is looked up in the registry, and every archive is taken and validated, all before anything is recorded. The challenge is then persisted under the verdict an update would give it, each build's row is found or opened by its (schema, format, seed), and the build is committed as a rebuild is: the instances of the generation it replaces are restarted or relaunched. A build whose row already serves the generation delivered is left as it is, instances included, so the same hand-over twice changes nothing. A cmgrd on a local build plane refuses the hand-over."
      parameters:
        - in: "formData"
          name: "hand_over"
          description: "The JSON HandOver: the challenge in the GET /state element shape with the builds handed over, and the pin fingerprint they were made under. Must be the first part."
          required: true
          type: string
        - in: "formData"
          name: "artifacts.<i>"
          description: "The artifact archive (gzip tar, as GET /builds/{build_id}/artifacts.tar.gz serves it) of the build at index i of the hand-over's builds: one part per build that declares has_artifacts, following hand_over in build order."
          required: false
          type: file
        - in: "query"
          name: "prune_old"
          description: "With `true`, the image generation each rebuilt build displaces from rollback retention is untagged in the registry (update's --prune-old)."
          required: false
          type: boolean
      responses:
        "400":
          description: "The hand-over contradicts itself or its inputs (not multipart, hand_over missing or malformed, a build of another challenge or source generation, a content checksum its inputs do not give, an image for a host the challenge does not name), or an archive it declares is missing, malformed, oversized or empty; nothing was recorded"
        "409":
          description: "An image tag the hand-over names is not in the registry (nothing was recorded), or this cmgrd is on a local build plane and builds for itself"
        "500":
          description: "The registry or the database could not be asked (nothing was recorded), or a build could not be committed once the writes had begun: the body is the HandOverResponse, its errors naming each such build, dropped or left at its previous generation as after a failed rebuild"
        "200":
          description: "The verdict, as POST /update reports one, with the challenge as recorded"
          schema:
            $ref: "#/definitions/HandOverResponse"
    delete:
      tags: [challenges]
      summary: "Removes a challenge that has no builds"
      description: "The counterpart of the hand-over, for a challenge the build plane no longer has. Refused while builds of it are on record: those go with their schema (DELETE /schemas/{name}) or with DELETE /builds/{build_id}. A cmgrd on a local build plane accepts it too, but there its tree decides: the next update finds the challenge again unless it is gone from the tree as well."
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "409":
          description: "The challenge still has builds on record"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully deleted"
  /builds/{build_id}:
    parameters:
      - name: "build_id"
        in: "path"
        description: "The identifier for the build"
        required: true
        type: "string"
    get:
      tags: [builds]
      produces: ["application/json"]
      summary: "Gets the metadata for the build"
      responses:
        "404":
          description: "Invalid path string to include invalid build identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the build"
          schema:
            $ref: "#/definitions/BuildMetadata"
    post:
      tags: [builds]
      produces: ["application/json"]
      summary: "Starts an instance of the build"
      description: "Fails for builds of non-service challenges (`delivery_type` other than \"service\"), which are delivered without instances."
      parameters:
        - in: "body"
          name: "body"
          description: "Optional runtime configuration (e.g. user_id or dynamic environment variables). `user_id` and any `env` values will be injected into the container with a `CMGR_` prefix."
          required: false
          schema:
            $ref: "#/definitions/InstanceStartRequest"
      responses:
        "404":
          description: "Invalid path string to include invalid build identifier"
        "500":
          description: "A database error occurred in `cmgr`, or the build belongs to a non-service challenge and cannot have instances"
        "201":
          description: "The identifier of the new instance"
          schema:
            type: integer
            format: int64
    delete:
      tags: [builds]
      produces: ["application/json"]
      summary: "Destroys the build (releases resources)"
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully deleted"
  /builds/{build_id}/{artifact}:
    parameters:
      - name: "build_id"
        in: "path"
        description: "The identifier for the build"
        required: true
        type: "string"
      - name: "artifact"
        in: "path"
        description: "The name of the artifact to download ('artifacts.tar.gz' to download all of them in a bundle)"
        required: true
        type: "string"
    get:
      tags: [builds]
      summary: "The requested artifact"
      responses:
        "404":
          description: "The requested artifact does not exist"
        "500":
          description: "An error occurred while reading the artifact from disk"
        "200":
          description: "The artifact"
  /instances/{instance_id}:
    parameters:
      - name: "instance_id"
        in: "path"
        description: "The identifier for the instance"
        required: true
        type: "string"
    get:
      tags: [instances]
      produces: ["application/json"]
      summary: "Gets the metadata for the instance"
      responses:
        "404":
          description: "Invalid path string to include invalid instance identifier"
        "500":
          description: "A database error occurred in `cmgr`"
        "200":
          description: "The metadata for the instance"
          schema:
            $ref: "#/definitions/InstanceMetadata"
    post:
      tags: [instances]
      produces: ["application/json"]
      summary: "Runs the automated solver against the instance"
      responses:
        "404":
          description: "Invalid path string to include invalid instance identifier"
        "500":
          description: "A database error occurred in `cmgr`.  Could also indicate that the solve failed or does not exist."
        "204":
          description: "Indicates solve ran correctly"
    delete:
      tags: [instances]
      produces: ["application/json"]
      summary: "Stops an instance"
      responses:
        "404":
          description: "Invalid path string to include invalid challenge identifier"
        "500":
          description: "A database error occurred in `cmgr` (may also indicate that there are live instances of the build)"
        "204":
          description: "Indicates successfully stopped"
  /schemas:
    get:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Gets the list of all current schemas"
      responses:
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)"
        "200":
          description: "The list of schemas"
          schema:
            type: array
            items:
              type: string
    post:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Creates a schema with the given definition"
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/SchemaDefinition"
      responses:
        "400":
          description: "Value for 'schema_name' did not match the name in the schema definition"
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)."
        "201":
          description: "Indicates schema created successfully"
  /schemas/{schema_name}:
    parameters:
      - name: "schema_name"
        in: "path"
        description: "The identifier for the schema"
        required: true
        type: "string"
    get:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Gets the current deployed state of the schema"
      responses:
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)"
        "200":
          description: "The metadata for all challenges, builds, and instances controlled or referenced by this schema"
          schema:
            $ref: "#/definitions/ChallengeMetadata"
    post:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Updates the schema to match the given definition"
      parameters:
        - in: "body"
          name: "body"
          description: "templating information for `cmgr`"
          required: true
          schema:
            $ref: "#/definitions/SchemaDefinition"
      responses:
        "400":
          description: "Value for 'schema_name' did not match the name in the schema definition"
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr` (currently includes bad build identifiers)."
        "204":
          description: "Indicates schema updated successfully"
    delete:
      tags: [schemas]
      produces: ["application/json"]
      summary: "Deletes a schema and all of its associated builds and instances"
      responses:
        "404":
          description: "Invalid path string"
        "500":
          description: "A database error occurred in `cmgr`"
        "204":
          description: "Indicates successfully removed"
definitions:
  ChallengeListElement:
    type: "object"
    properties:
      id:
        type: string
      source_checksum:
        type: integer
        format: int64
      metadata_checksum:
        type: integer
        format: int64
      solve_script:
        type: boolean
      delivery_type:
        type: string
        enum: [service, artifact_only, flag_only]
        description: "Derived runtime shape of the challenge; non-service challenges never have instances."
  ChallengeMetadata:
    type: "object"
    properties:
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      challenge_type:
        type: string
      description:
        type: string
      details:
        type: string
      hints:
        type: array
        items:
          type: string
      source_checksum:
        type: integer
        format: int64
      metadata_checksum:
        type: integer
        format: int64
      path:
        type: string
      templatable:
        type: boolean
      port_map:
        type: object
        additionalProperties:
          type: integer
          format: int32
      max_users:
        type: integer
        format: int32
      category:
        type: string
      points:
        type: integer
        format: int32
      tags:
        type: array
        items:
          type: string
      attributes:
        type: object
        additionalProperties:
          type: string
      solve_script:
        type: boolean
      delivery_type:
        type: string
        enum: [service, artifact_only, flag_only]
        description: >-
          Derived runtime shape of the challenge. "service" challenges publish
          at least one port and are the only ones that run instances.
          "artifact_only" challenges publish no ports and are delivered
          entirely via build artifacts: their builds always report an empty
          instance list, and requests to start an instance of them fail. An
          empty instance list on a build whose challenge is "service" AND
          whose instance_count is positive indicates a deployment problem;
          on-demand builds (instance_count -1) legitimately have zero
          instances between user sessions. "flag_only" challenges (declared
          via the "flag-only" challenge type) publish neither ports nor
          artifacts; the build exists only to generate a flag and lookup data
          for a bare submission prompt, so front-ends should render only a
          submission field for them. Absent field = pre-delivery_type cmgr,
          which launches instances for every build.
      builds:
        type: array
        items:
          $ref: "#/definitions/BuildMetadata"
  BuildMetadata:
    type: object
    properties:
      id:
        type: integer
        format: int64
      flag:
        type: string
      lookup_data:
        type: object
        additionalProperties:
          type: string
      seed:
        type: integer
        format: int32
      format:
        type: string
      checksum:
        type: integer
        format: int64
        description: >
          Content identity of the build's images (an unsigned 32-bit CRC over
          the challenge source checksum and flag format). Embedded in the
          images' docker tags; omitted when not yet determined.
      prev_checksum:
        type: integer
        format: int64
        description: >
          The image generation displaced on the last rebuild, retained as a
          rollback target. Omitted when there is no retained rollback
          generation.
      source_checksum:
        type: integer
        format: int64
        description: >
          The challenge source generation (its source_checksum) this build's
          images were produced from. Equal to the challenge's current value
          when the build is current; a different value means a rebuild
          failed and the build still serves an earlier generation. Omitted
          until the build has been built.
      images:
        type: array
        items:
          $ref: "#/definitions/Image"
      has_artifacts:
        type: boolean
      last_solved:
        type: integer
        format: int64
      challenge:
        type: string
      instances:
        type: array
        items:
          $ref: "#/definitions/InstanceMetadata"
  Image:
    type: object
    properties:
      id:
        type: integer
        format: int64
      docker_id:
        type: string
      ports:
        type: array
        items:
          type: string
      build:
        type: integer
        format: int64
  InstanceMetadata:
    type: object
    properties:
      id:
        type: integer
        format: int64
      ports:
        type: object
        additionalProperties:
          type: string
      containers:
        type: array
        items:
          type: string
      last_solve:
        type: integer
        format: int64
      build:
        type: integer
        format: int64
      network:
        type: string
  BuildChallengeRequest:
    type: object
    properties:
      flag_format:
        type: string
      seeds:
        type: array
        items:
          type: integer
          format: int32
  HandOver:
    type: object
    description: "What PUT /challenges/{challenge_id} carries. The challenge is the GET /state element shape, its builds being the builds handed over: seed, format, schema and instance_count as the schema names them on the build plane, flag, lookup_data, images with their exposed_ports, has_artifacts, and checksum and source_checksum as stamped there. Build ids, instances, last_solved and prev_checksum are the receiving daemon's own and are ignored."
    properties:
      challenge:
        $ref: "#/definitions/ChallengeMetadata"
      pin_fingerprint:
        type: integer
        format: int32
        description: "The base image pin fingerprint the builds were made under; 0 without pins"
  HandOverResponse:
    type: object
    description: "POST /update's response shape, with the challenge as recorded (its builds carrying this daemon's ids)"
    properties:
      added:
        type: array
        items:
          type: string
      refreshed:
        type: array
        items:
          type: string
      updated:
        type: array
        items:
          type: string
      stale:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
      unmodified:
        type: array
        items:
          type: string
      errors:
        type: array
        items:
          type: string
      challenge:
        $ref: "#/definitions/ChallengeMetadata"
  SchemaDefinition:
    type: object
    properties:
      name:
        type: string
      flag_format:
        type: string
      challenges:
        type: object
        additionalProperties:
          $ref: "#/definitions/SchemaElement"
  SchemaElement:
    type: object
    properties:
      seeds:
        type: array
        items:
          type: integer
          format: int32
      instance_count:
        type: integer
        format: int32
  InstanceStartRequest:
    type: object
    description: "Optional payload when starting an instance of a build to pass runtime information. Environment variables in the map will be injected with a `CMGR_` prefix."
    properties:
      user_id:
        type: string
        description: "An identifier for the user starting the instance. Injected as `CMGR_USER_ID`."
      env:
        type: object
        description: "Additional custom environment variables to inject. Keys will have `CMGR_` prepended before being exported inside the container."
        additionalProperties:
          type: string
